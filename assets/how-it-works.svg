<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-labelledby="title desc">
  <title id="title">From banking messages to groups by issue</title>
  <desc id="desc">The default consensus check can return groups without model calls. Otherwise, split 600 messages into nine small groups, merge them into three groups using same-issue probabilities, and reconsider the 90 most ambiguous messages. All examples and scores are illustrative.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #172033; }
      .title { font-size: 28px; font-weight: 700; }
      .step { font-size: 22px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; }
      .muted { fill: #526176; }
      .label { font-size: 13px; font-weight: 700; letter-spacing: 1px; }
      .strong { font-weight: 650; }
      .line { fill: none; stroke: #64748b; stroke-width: 1.6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1080" height="650" rx="20" fill="#f6f8fc"/>
  <text x="32" y="46" class="title">Group messages by the issue they describe.</text>
  <text x="32" y="74" class="body muted">600 banking messages · k = 3 · illustrative example</text>

  <rect x="32" y="98" width="1016" height="80" rx="12" fill="#e9eff8"/>
  <text x="52" y="123" class="label muted">DEFAULT CHECK</text>
  <text x="52" y="151" class="body strong">Do embedding groups and word-based groups agree?</text>
  <path d="M 550 139 H 594" class="line"/>
  <text x="612" y="130" class="body strong">Yes → combine both views</text>
  <text x="612" y="156" class="small muted">Return k groups. No decision-model calls.</text>
  <path d="M 60 178 V 222" class="line"/>
  <text x="78" y="206" class="small muted">Otherwise, or with consensus=False</text>

  <rect x="32" y="230" width="318" height="324" rx="14" fill="#ffffff" stroke="#d8e0eb"/>
  <rect x="381" y="230" width="318" height="324" rx="14" fill="#ffffff" stroke="#d8e0eb"/>
  <rect x="730" y="230" width="318" height="324" rx="14" fill="#ffffff" stroke="#d8e0eb"/>
  <path d="M 354 391 H 376" class="line"/>
  <path d="M 703 391 H 725" class="line"/>

  <text x="52" y="262" class="label muted">01 / SPLIT BY DISTANCE</text>
  <text x="52" y="294" class="step">600 texts → 9 small groups</text>
  <text x="52" y="322" class="small muted">Each gets words + example texts.</text>
  <rect x="52" y="343" width="278" height="50" rx="8" fill="#f1f4f9"/>
  <text x="66" y="374" class="body"><tspan class="strong">A</tspan><tspan dx="14">transfer fee, charged</tspan></text>
  <rect x="52" y="405" width="278" height="50" rx="8" fill="#f1f4f9"/>
  <text x="66" y="436" class="body"><tspan class="strong">B</tspan><tspan dx="14">sending money, cost</tspan></text>
  <rect x="52" y="467" width="278" height="50" rx="8" fill="#f1f4f9"/>
  <text x="66" y="498" class="body"><tspan class="strong">C</tspan><tspan dx="14">transfer still pending</tspan></text>
  <text x="52" y="539" class="small muted">3 of the 9 group cards shown</text>

  <text x="401" y="262" class="label muted">02 / MERGE BY MEANING</text>
  <text x="401" y="294" class="step">9 groups → 3 groups</text>
  <text x="401" y="322" class="small muted">Ask the model: “Same issue?”</text>
  <text x="401" y="360" class="body strong">A + B</text>
  <text x="485" y="360" class="body">0.96</text>
  <text x="549" y="360" class="small" style="fill:#166552">Both about fees</text>
  <text x="401" y="390" class="body strong">A + C</text>
  <text x="485" y="390" class="body">0.08</text>
  <text x="549" y="390" class="small muted">Different issues</text>
  <path d="M 540 408 V 429" class="line"/>
  <rect x="401" y="442" width="278" height="27" rx="6" fill="#d9f2e8"/>
  <text x="415" y="462" class="small strong" style="fill:#166552">Transfer fees (includes A + B)</text>
  <rect x="401" y="477" width="278" height="27" rx="6" fill="#e0e9ff"/>
  <text x="415" y="497" class="small strong" style="fill:#304f9c">Transfer delays (includes C)</text>
  <rect x="401" y="512" width="278" height="27" rx="6" fill="#f3e5fc"/>
  <text x="415" y="532" class="small strong" style="fill:#794598">Lost cards</text>

  <text x="750" y="262" class="label muted">03 / RECHECK AMBIGUOUS TEXTS</text>
  <text x="750" y="294" class="step">90 messages reconsidered</text>
  <text x="750" y="322" class="small muted">The closest 15% to a boundary.</text>
  <rect x="750" y="343" width="278" height="78" rx="8" fill="#f1f4f9"/>
  <text x="766" y="373" class="body strong">“Why was I charged</text>
  <text x="766" y="399" class="body strong">to send money?”</text>
  <text x="750" y="452" class="small muted">Distance favours transfer delays.</text>
  <text x="750" y="478" class="small muted">Model + distance favour fees.</text>
  <rect x="750" y="501" width="278" height="38" rx="8" fill="#d9f2e8"/>
  <text x="766" y="527" class="body strong" style="fill:#166552">Assign to transfer fees</text>

  <text x="32" y="592" class="body strong">Output: one numeric group label per message.</text>
  <text x="32" y="620" class="small muted">Issue names are for explanation. You provide k and the sorting instruction, not a category list.</text>
</svg>
