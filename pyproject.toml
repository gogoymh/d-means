[project]
name = "d-means"
version = "0.1.0"
description = "d-means: k-means clustering steered by any typed decision model: Jev, Clef, a chat LLM, or your own function."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[dependency-groups]
dev = ["pytest>=8", "faiss-cpu>=1.16", "torch>=2.4"]  # official E-means and O-means baselines in bench/

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dmeans"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
