<title id="t">Clustering accuracy vs. epochs</title><desc id="d">Mean clustering accuracy against passes over the data. The best baseline ends at 55.6% (K-means). Epochs needed to reach it: D-means 0.512, K-means 16, E-means 0.496, O-means 0.496.</desc>
